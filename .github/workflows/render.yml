name: Render video

# Dipicu oleh Cloudflare Worker lewat repository_dispatch,
# atau manual dari tab Actions.
on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      compositionId:
        description: Komposisi yang dirender
        default: VerticalPromo
        type: string

permissions:
  contents: write # perlu untuk mengunggah hasil ke Release

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CALLBACK_URL: ${{ github.event.client_payload.callbackUrl }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Siapkan variabel job
        id: vars
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "job_id=${{ github.event.client_payload.jobId || 'manual' }}" >> $GITHUB_OUTPUT
          echo "comp=${{ github.event.client_payload.compositionId || inputs.compositionId || 'VerticalPromo' }}" >> $GITHUB_OUTPUT
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          # narasi & suara diekstrak dari payload (aman terhadap kutip/emoji)
          echo "$PAYLOAD" > /tmp/payload.json
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json, os
          p = json.load(open('/tmp/payload.json')) or {}
          ip = p.get('inputProps') or {}
          print('voice=' + (ip.get('voice') or 'id-ID-GadisNeural'))
          print('rate=' + (ip.get('rate') or '+0%'))
          nar = ip.get('narration') or {}
          print('has_narration=' + ('1' if nar else '0'))
          json.dump(nar, open('/tmp/narration.json', 'w'))
          PY

      # ---------- lapor mulai ----------
      - name: Lapor mulai
        if: env.CALLBACK_URL != ''
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "callback HTTP %{http_code}\n" -X PATCH "$CALLBACK_URL" \
            -H "authorization: Bearer $CALLBACK_SECRET" \
            -H "content-type: application/json" \
            -d '{"status":"running","stage":"setup","progress":0.04,
                 "message":"Menyiapkan runner…","runUrl":"${{ steps.vars.outputs.run_url }}"}'

      - run: npm ci

      - name: Pasang Chromium
        run: npx playwright install --with-deps chromium

      # ---------- narasi ----------
      - name: Pasang edge-tts
        run: pip install --quiet edge-tts

      - name: Lapor narasi
        if: env.CALLBACK_URL != ''
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "callback HTTP %{http_code}\n" -X PATCH "$CALLBACK_URL" \
            -H "authorization: Bearer $CALLBACK_SECRET" \
            -H "content-type: application/json" \
            -d '{"stage":"narasi","progress":0.10,"message":"Membuat narasi suara…"}'

      - name: Buat narasi (TTS)
        run: |
          python3 scripts/tts.py \
            --voice "${{ steps.vars.outputs.voice }}" \
            --rate "${{ steps.vars.outputs.rate }}" \
            --narration "$(cat /tmp/narration.json)"

      - name: Bangun timeline + audio gabungan
        env:
          # timeline & caption harus memakai teks narasi yang sama dengan TTS
          NARRATION_FILE: /tmp/narration.json
        run: npm run build:assets

      # ---------- render ----------
      - name: Render
        env:
          COMP: ${{ steps.vars.outputs.comp }}
          OUT: out/${{ steps.vars.outputs.job_id }}.mp4
          INPUT_PROPS: ${{ toJSON(github.event.client_payload.inputProps) }}
        run: npm run render

      - name: Unggah ke Release
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="out/${{ steps.vars.outputs.job_id }}.mp4"
          TAG="render-${{ steps.vars.outputs.job_id }}"
          BYTES=$(stat -c%s "$FILE")

          gh release create "$TAG" "$FILE" \
            --title "Render ${{ steps.vars.outputs.job_id }}" \
            --notes "Komposisi: ${{ steps.vars.outputs.comp }}" \
            || gh release upload "$TAG" "$FILE" --clobber

          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/${{ steps.vars.outputs.job_id }}.mp4"
          echo "url=$URL"     >> $GITHUB_OUTPUT
          echo "bytes=$BYTES" >> $GITHUB_OUTPUT

      # cadangan: tetap tersedia sebagai artifact walau Release gagal
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.vars.outputs.job_id }}
          path: out/*.mp4
          retention-days: 7

      - name: Lapor selesai
        if: env.CALLBACK_URL != ''
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "callback HTTP %{http_code}\n" -X PATCH "$CALLBACK_URL" \
            -H "authorization: Bearer $CALLBACK_SECRET" \
            -H "content-type: application/json" \
            -d '{"status":"done","stage":"done","progress":1,"message":"Selesai",
                 "videoUrl":"${{ steps.upload.outputs.url }}",
                 "bytes":${{ steps.upload.outputs.bytes }}}'

      - name: Lapor gagal
        if: failure() && env.CALLBACK_URL != ''
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "callback HTTP %{http_code}\n" -X PATCH "$CALLBACK_URL" \
            -H "authorization: Bearer $CALLBACK_SECRET" \
            -H "content-type: application/json" \
            -d '{"status":"error","stage":"error",
                 "error":"Render gagal — lihat log Actions",
                 "runUrl":"${{ steps.vars.outputs.run_url }}"}'
